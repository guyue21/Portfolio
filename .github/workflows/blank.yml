name: 部署静态作品集到 GitHub Pages

# 触发时机：main分支推送代码时自动运行，也支持手动启动
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库全部代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 将 guyuewebsite 目录下所有静态文件发布到 gh-pages 分支
      - name: 部署静态页面
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 内置授权token，无需自己配置密钥
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 你的网页根目录：项目里网页都放在 guyuewebsite 文件夹内
          publish_dir: ./guyuewebsite
   
